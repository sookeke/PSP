name: Security CI

on:
  push:
    branches: [master, test, dev, pims-sookeke, sookeke-patch-1]
  pull_request:
    branches: [master, test, dev, pims-sookeke, sookeke-patch-1]

jobs:

  build_frontend:

    name: pims-frontend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    env:
      working-directory: ./frontend
      HTML_STRING: smaple

    steps:
    - uses: actions/checkout@v1
    - name: Install requirements
      run: pip install trufflehog3 jtbl
    - name: Build PIMS Frontend
      run: |
        docker pull registry.access.redhat.com/ubi8/nodejs-14:1-35
        docker tag registry.access.redhat.com/ubi8/nodejs-14:1-35 noejs-14:latest
        docker images ls
      working-directory: ${{env.working-directory}}
    - name: Scan PIMS Frontend Image with Aqua Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'registry.access.redhat.com/ubi8/nodejs-14:1-35'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        output: 'pims-frontend.txt'
    - name: Save PR number and scan results
      if: always()
      run: |
          mkdir -p ./pr
          echo ${{ github.event.pull_request.number }} > ./pr/NR
          cp pims-frontend.txt ./pr/PRBODY
    - if: always()
      name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: Scanreport
        path: pr/
    - if: always()
      name: html to string
      run: ls
    - if: always()
      name: comment on PR with Binder link
      uses: actions/github-script@v3
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          // Get the branch name
          github.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: ${{ github.event.pull_request.number }}
          }).then( (pr) => {

            // use the branch name to make a comment  on the PR with a Binder badge
            var BRANCH_NAME = pr.data.head.ref
            github.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `[![Binder](https://mybinder.org/badge_logo.svg)](https://mybinder.org/v2/gh/${context.repo.owner}/${context.repo.repo}/${BRANCH_NAME}) : lunch badge on this branch`
            })
          })
      env:
        BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        
  comment_pr:
  # this action will leave a comment in response to credential scans performed on pull requests
    if: always() && needs.build_frontend.result == 'failure' && github.event_name == 'push'
    needs: build_frontend 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download artifact
        uses: actions/download-artifact@master
        with:
          name: Scanreport
          path: pr/

      - run: |
          cd pr/
          ls

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          cd pr/
          commentPR () {
            gh pr comment $PRNUM -b "${1}"
          }
          PRNUM=$(cat ./NR)
          PRBODY=$(cat ./PRBODY)
          commentPR "```$PRBODY```"
