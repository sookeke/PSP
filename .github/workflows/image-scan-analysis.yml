name: Security CI

on:
  push:
    branches: [master, test, dev, pims-sookeke, sookeke-patch-1]
  pull_request:
    branches: [master, test, dev, pims-sookeke, sookeke-patch-1]

jobs:

  build_frontend:

    name: pims-frontend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      working-directory: ./frontend

    steps:
    - uses: actions/checkout@v1
    - name: Setup python
      uses: actions/setup-python@v2
      with:
          python-version: "3.x"

    - name: Display python version
      run: python -c "import sys; print(sys.version)"

    - name: Cache python dependencies
      uses: actions/cache@v2
      with:
        path: ~/.cache/pip # This path is specific to Ubuntu
        key: ${{ runner.os }}-pip

    - name: Install requirements
      run: pip install trufflehog3 jtbl
    - name: Build PIMS Frontend
      run: |
        docker build -t docker.io/pims-frontend:${{ github.sha }} .   
      working-directory: ${{env.working-directory}}
    - name: Scan PIMS Frontend Image with Aqua Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'docker.io/pims-frontend:${{ github.sha }}'
        format: 'json'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        output: 'pims-frontend.json'
    - name: Save PR number and scan results
      if: always()
      run: |
          mkdir -p ./pr
          echo ${{ github.event.pull_request.number }} > ./pr/NR
          cp pims-frontend.json ./pr/PRBODY
    - if: always()
      name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: Scanreport
        path: pr/
    - name: Human readable scan report
      if: always()
      run: |
        cd build/
        ls -A
        ./build/secops_report.sh trufflehog_report.json
    - name: Generate HTML report only if secrets were found
      if: failure()
      run: |
        trufflehog3 -R pims-frontend.json --output pims-frontend.html
        ls -la
        
  comment_pr:
  # this action will leave a comment in response to credential scans performed on pull requests
    if: failure() && github.event.workflow_run.event == 'push'
    needs: build_frontend 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download artifact
        uses: actions/download-artifact@master
        with:
          name: Scanreport
          path: pr/

      - run: |
          cd pr/
          ls

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          cd pr/
          commentPR () {
            gh pr comment $PRNUM -b "${1}"
          }
          PRNUM=$(cat ./NR)
          PRBODY=$(cat ./PRBODY)
          commentPR "$PRBODY"
