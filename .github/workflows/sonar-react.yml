name: Sonar (React)

on:
  push:
    branches: [master, dev, test, sookeke-patch-1]
  pull_request:
    branches: [master, dev, test, sookeke-patch-1]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      working-directory: ./frontend

    strategy:
      matrix:
        node-version: [14.x]

    steps:
      - uses: actions/checkout@v2

      - name: Extract Branch Name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        working-directory: ${{env.working-directory}}

      - run: npm run lint
        working-directory: ${{env.working-directory}}

      - run: npm run build --if-present
        working-directory: ${{env.working-directory}}
      
      - run: npm run coverage
        working-directory: ${{env.working-directory}}

      - name: Codecov
        uses: codecov/codecov-action@v1.5.0
        with:
          # User defined upload name. Visible in Codecov UI
          name: PIMS
          # Repository upload token - get it from codecov.io. Required only for private repositories
          token: ${{ secrets.CodeCov }}
          # Path to coverage file to upload
          file: ${{env.working-directory}}/coverage/coverage-final.json
          # Flag upload to group coverage metrics (e.g. unittests | integration | ui,chrome)
          flags: unittests
          # Environment variables to tag the upload with (e.g. PYTHON | OS,PYTHON)
          env_vars: javascript
          # Specify whether or not CI build should fail if Codecov runs into an error during upload
          fail_ci_if_error: true

      - name: SonarQube Scan
        id: scan
        uses: philips-software/sonar-scanner-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          PROJECT_KEY: 21faa627-fe70-4a67-89e3-1262a32d2e2c
          PROJECT_NAME: PIMS-APP
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          baseDir: ${{env.working-directory}}
          token: ${{ env.SONAR_TOKEN }}
          projectName: ${{env.PROJECT_NAME}}
          url: ${{env.SONAR_HOST_URL}}
          isCommunityEdition: true
          projectKey: ${{env.PROJECT_KEY}}
          enablePullRequestDecoration: true
          runQualityGate: true
          
      - name: Check Quality Gate and Create Comment
        if: failure() && steps.scan.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          PROJECT_KEY: 21faa627-fe70-4a67-89e3-1262a32d2e2c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-author: 'github-actions[bot]'
          issue-number: ${{ github.event.pull_request.number }}
          body : |
            Failed Static Code Analysis Quality Gate.

            [Debug output of workflow][1]

            [1]: ${{ env.SONAR_HOST_URL }}dashboard?id=${{env.PROJECT_KEY}}
          
