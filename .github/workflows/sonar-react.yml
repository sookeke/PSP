name: Sonar (React)

on:
  push:
    branches: [master, dev, test, sookeke-patch-1]
  pull_request:
    branches: [master, dev, test, sookeke-patch-1]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      working-directory: ./frontend

    strategy:
      matrix:
        node-version: [14.x]

    steps:
      - uses: actions/checkout@v2

      - name: Extract Branch Name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        working-directory: ${{env.working-directory}}

      - run: npm run lint
        working-directory: ${{env.working-directory}}

      - run: npm run build --if-present
        working-directory: ${{env.working-directory}}

      - name: SonarQube Scan
        uses: philips-software/sonar-scanner-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          PROJECT_KEY: 21faa627-fe70-4a67-89e3-1262a32d2e2c
          PROJECT_NAME: PIMS-APP
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          baseDir: ${{env.working-directory}}
          token: ${{ env.SONAR_TOKEN }}
          projectName: ${{env.PROJECT_NAME}}
          url: ${{env.SONAR_HOST_URL}}
          projectKey: ${{env.PROJECT_KEY}}
          enablePullRequestDecoration: true
          runQualityGate: true
          
